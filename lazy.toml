# Raven Settings' build interface for imlazy. Mirrors the Makefile.

[settings]
default = "build"

# GTK 4 and libadwaita, installed through rvn when pkg-config cannot find
# them. Same versions and package names as RVN_DEPS / PC_DEPS in the Makefile.
[commands.deps]
desc = "Install the system libraries the build links against, if missing"
run = ["sh -c 'pkg-config --exists \"gtk4 >= 4.12, libadwaita-1 >= 1.5\" || rvn install --repo-only -y gtk4 libadwaita'"]

[commands.build]
desc = "Build, optimised"
dep = ["deps"]
run = ["cargo build --locked --workspace --release"]
alias = ["b"]

[commands.run]
desc = "Run the settings app"
dep = ["deps"]
run = ["cargo build --workspace --release", "cargo run --release -p raven-settings"]

[commands.probe]
desc = "Print what every backend sees (network, Bluetooth, sound, display, updates)"
dep = ["deps"]
run = ["cargo run --release -p raven-settings -- --probe"]

[commands.test]
desc = "Run the unit tests"
dep = ["deps"]
run = ["cargo test --locked --workspace"]
alias = ["t"]

[commands.check]
desc = "fmt, clippy and tests"
dep = ["deps"]
run = ["cargo fmt --check", "cargo clippy --locked --workspace --all-targets -- -D warnings", "cargo test --locked --workspace"]

# The Makefile's install target depends on build, so `sudo make install`
# builds as root. Here the build runs as you and only these steps escalate.
[commands.install]
desc = "Install to /usr/local"
dep = ["build"]
escalate = true
writes = ["/usr/local/bin", "/usr/local/share"]
run = [
  "install -Dm755 target/release/raven-settings /usr/local/bin/raven-settings",
  "install -Dm755 target/release/raven-keycast /usr/local/bin/raven-keycast",
  "install -Dm644 data/com.ravensettings.Raven.desktop /usr/local/share/applications/com.ravensettings.Raven.desktop",
  "install -Dm644 data/com.ravensettings.Raven.metainfo.xml /usr/local/share/metainfo/com.ravensettings.Raven.metainfo.xml",
  "install -Dm644 data/icons/hicolor/scalable/apps/com.ravensettings.Raven.svg /usr/local/share/icons/hicolor/scalable/apps/com.ravensettings.Raven.svg",
  "install -Dm644 data/90-backlight.rules /usr/local/share/raven-settings/90-backlight.rules",
  "sh -c 'command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/local/share/applications || true'",
  "sh -c 'command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -qtf /usr/local/share/icons/hicolor || true'",
]

[commands.uninstall]
desc = "Remove the installed copy"
escalate = true
writes = ["/usr/local/bin", "/usr/local/share"]
run = ["make uninstall"]
